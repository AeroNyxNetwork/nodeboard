# AeroNyx Nodeboard nginx reverse proxy
#
# Purpose:
#   Publish the Next.js operator console while keeping the Node process bound
#   to 127.0.0.1:3000.
#
# Frontend source:
#   /root/open/nodeboard
#
# Browser API base:
#   https://api.aeronyx.network/api/privacy_network
#
# Backend source files behind the API:
#   /root/aeronyx/privacy_network/api/vpn_observability.py
#   /root/aeronyx/privacy_network/services/heartbeat_service.py
#   /root/aeronyx/privacy_network/api/nodes.py
#
# Rust heartbeat producer:
#   /root/open/AeroNyx/crates/aeronyx-server/src/api/vpn_health.rs
#   /root/open/AeroNyx/crates/aeronyx-server/src/management/reporter.rs

server {
    listen 80;
    server_name nodeboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nodeboard.example.com;

    ssl_certificate /etc/nginx/ssl/nodeboard.pem;
    ssl_certificate_key /etc/nginx/ssl/nodeboard.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

